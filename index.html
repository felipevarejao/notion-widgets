<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Widget - Horizontal</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scrollbar-width: none;
  }
  *::-webkit-scrollbar { display: none; }

  html, body {
    background-color: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    width: 760px;
    overflow: hidden;
  }

  .widget-root {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── TOP ROW: Greeting + Weather ── */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .greeting-block {}
  .greeting {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #fff;
  }
  .quote-of-the-day {
    font-size: 12px;
    font-style: italic;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    line-height: 1.4;
    max-width: 380px;
  }
  .quote-author {
    display: block;
    font-size: 9px;
    color: rgba(255,255,255,0.2);
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }

  .weather-block {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 16px;
  }
  .weather-block .w-icon { font-size: 28px; line-height: 1; }
  .weather-block .w-temp {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }
  .weather-block .w-desc {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }

  /* ── MIDDLE ROW: Progress Bars + Calendar ── */
  .middle-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  /* Progress section */
  .progress-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .progress-group {}
  .progress-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .progress-label span:last-child {
    font-weight: 600;
    color: rgba(255,255,255,0.6);
  }
  .bar-container {
    width: 100%;
    height: 7px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 1.3s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .bar-year    { background: linear-gradient(90deg, #6366f1, #10b981); }
  .bar-quarter { background: linear-gradient(90deg, #ec4899, #8b5cf6); }
  .bar-month   { background: linear-gradient(90deg, #3b82f6, #06b6d4); }

  .days-left {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
  }
  .days-left strong { color: #fff; font-weight: 700; }

  /* Divider */
  .vdivider {
    width: 1px;
    background: rgba(255,255,255,0.05);
    align-self: stretch;
  }

  /* Calendar section */
  .calendar-section {
    width: 230px;
    flex-shrink: 0;
  }

  .calendar-title {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
    font-size: 10px;
  }
  .calendar-day-head {
    font-weight: 700;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
    font-size: 8px;
    padding-bottom: 4px;
  }
  .calendar-day {
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    border-radius: 50%;
  }
  .calendar-day.empty { visibility: hidden; }
  .calendar-day.today {
    color: #fff;
    font-weight: 700;
    background: #6366f1;
    box-shadow: 0 0 8px rgba(99,102,241,0.5);
  }
</style>
</head>
<body>

<div class="widget-root">

  <!-- TOP ROW -->
  <div class="top-row">
    <div class="greeting-block">
      <div class="greeting" id="greeting"></div>
      <div class="quote-of-the-day">
        <span id="quote">Buscando frase do dia...</span>
        <span id="author" class="quote-author"></span>
      </div>
    </div>
    <div class="weather-block">
      <div class="w-icon" id="icon">⛅</div>
      <div>
        <div class="w-temp" id="temp">--°C</div>
        <div class="w-desc" id="desc">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MIDDLE ROW -->
  <div class="middle-row">

    <!-- Progress bars -->
    <div class="progress-section">
      <div class="progress-group">
        <div class="progress-label"><span>Ano Corrente</span><span><span id="percent-year">0.0</span>%</span></div>
        <div class="bar-container"><div class="bar bar-year" id="bar-year"></div></div>
      </div>
      <div class="progress-group">
        <div class="progress-label"><span>Trimestre Atual</span><span><span id="percent-quarter">0.0</span>%</span></div>
        <div class="bar-container"><div class="bar bar-quarter" id="bar-quarter"></div></div>
      </div>
      <div class="progress-group">
        <div class="progress-label"><span>Mês Vigente</span><span><span id="percent-month">0.0</span>%</span></div>
        <div class="bar-container"><div class="bar bar-month" id="bar-month"></div></div>
      </div>
      <div class="days-left">Faltam <strong id="days">0</strong> dias para o fim do ano.</div>
    </div>

    <div class="vdivider"></div>

    <!-- Calendar -->
    <div class="calendar-section">
      <div class="calendar-title" id="calendar-title">Calendário</div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>

  </div>
</div>

<script>
const now = new Date();
const h = now.getHours();

// Saudação
const greet = (h >= 5 && h < 12) ? "Bom dia, Felipe! ☕" : (h >= 12 && h < 18) ? "Boa tarde, Felipe! ⚡" : "Boa noite, Felipe! 🌙";
document.getElementById("greeting").textContent = greet;

// Frase do dia
function carregarFraseDoDia() {
  fetch("https://raw.githubusercontent.com/jameslyons/pensador-api/master/quotes.json")
    .then(r => r.json())
    .then(data => {
      const filtradas = data.filter(f => f.text.length > 10 && f.text.length < 90);
      if (filtradas.length > 0) {
        const start = new Date(now.getFullYear(), 0, 0);
        const dayOfYear = Math.floor((now - start) / 86400000);
        const frase = filtradas[dayOfYear % filtradas.length];
        document.getElementById("quote").textContent = `"${frase.text.trim()}"`;
        document.getElementById("author").textContent = frase.author || "Desconhecido";
      }
    })
    .catch(() => {
      document.getElementById("quote").textContent = '"Foco no progresso, não na perfeição."';
      document.getElementById("author").textContent = "Produtividade";
    });
}
carregarFraseDoDia();

// Cálculos de Tempo
const startYear = new Date(now.getFullYear(), 0, 1);
const endYear   = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
const percentYear = ((now - startYear) / (endYear - startYear)) * 100;
document.getElementById("percent-year").textContent = percentYear.toFixed(1);
document.getElementById("days").textContent = Math.ceil((endYear - now) / 86400000);

const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
const endMonth   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
const percentMonth = ((now - startMonth) / (endMonth - startMonth)) * 100;
document.getElementById("percent-month").textContent = percentMonth.toFixed(1);

const qStart = Math.floor(now.getMonth() / 3) * 3;
const startQ = new Date(now.getFullYear(), qStart, 1);
const endQ   = new Date(now.getFullYear(), qStart + 3, 0, 23, 59, 59, 999);
const percentQ = ((now - startQ) / (endQ - startQ)) * 100;
document.getElementById("percent-quarter").textContent = percentQ.toFixed(1);

setTimeout(() => {
  document.getElementById("bar-year").style.width    = percentYear + "%";
  document.getElementById("bar-month").style.width   = percentMonth + "%";
  document.getElementById("bar-quarter").style.width = percentQ + "%";
}, 200);

// Calendário
function gerarCalendario() {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  document.getElementById("calendar-title").textContent = `${meses[now.getMonth()]} de ${now.getFullYear()}`;
  const grid = document.getElementById("calendar-grid");
  ["D","S","T","Q","Q","S","S"].forEach(d => {
    const cell = document.createElement("div");
    cell.className = "calendar-day-head";
    cell.textContent = d;
    grid.appendChild(cell);
  });
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const lastDay  = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day empty";
    grid.appendChild(cell);
  }
  for (let d = 1; d <= lastDay; d++) {
    const cell = document.createElement("div");
    cell.className = d === now.getDate() ? "calendar-day today" : "calendar-day";
    cell.textContent = d;
    grid.appendChild(cell);
  }
}
gerarCalendario();

// Clima
function setWeather(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r => r.json())
    .then(data => {
      const temp = Math.round(data.current_weather.temperature);
      document.getElementById("temp").textContent = temp + "°C";
      let icon = "⛅", desc = "Agradável";
      if (temp >= 30) { icon = "☀️"; desc = "Quente"; }
      else if (temp <= 18) { icon = "❄️"; desc = "Frio"; }
      document.getElementById("icon").textContent = icon;
      document.getElementById("desc").textContent = desc;
    }).catch(() => { document.getElementById("desc").textContent = "Sem sinal"; });
}
function fallback() {
  fetch("https://ipapi.co/json/").then(r => r.json()).then(l => setWeather(l.latitude, l.longitude))
    .catch(() => { document.getElementById("desc").textContent = "Offline"; });
}
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(p => setWeather(p.coords.latitude, p.coords.longitude), fallback);
} else { fallback(); }
</script>
</body>
</html>
