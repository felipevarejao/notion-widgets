<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #0f0f10;
    font-family: sans-serif;
    color: #e5e5e5;
    padding: 1rem;
  }

  .section {
    margin-bottom: 18px;
    padding: 16px;
    border-radius: 16px;

    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #ffffff;
    opacity: 0.9;
  }

  /* SAUDAÇÃO */
  .greeting {
    font-size: 20px;
    font-weight: 600;
  }

  /* PROGRESSO */
  .bar-container {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }

  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #22c55e);
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .stats {
    margin-top: 10px;
    font-size: 13px;
    color: #a1a1aa;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .value {
    color: #ffffff;
    font-weight: 500;
  }

  /* WEATHER */
  .weather {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .temp {
    font-size: 22px;
    font-weight: 600;
  }

  .desc {
    font-size: 13px;
    color: #a1a1aa;
  }

  .icon svg {
    width: 34px;
    height: 34px;
    opacity: 0.95;
  }
</style>
</head>

<body>

<!-- SAUDAÇÃO -->
<div class="section">
  <div class="title">Saudação</div>
  <div class="greeting" id="greeting"></div>
</div>

<!-- PROGRESSO DO ANO -->
<div class="section">
  <div class="title">Progresso do Ano</div>

  <div class="bar-container">
    <div class="bar" id="bar"></div>
  </div>

  <div class="stats">
    <div>Progresso: <span class="value" id="percent"></span>%</div>
    <div>Dias: <span class="value" id="days"></span></div>
    <div>Semanas: <span class="value" id="weeks"></span></div>
  </div>
</div>

<!-- CLIMA -->
<div class="section">
  <div class="title">Clima</div>

  <div class="weather">
    <div class="icon" id="icon"></div>
    <div>
      <div class="temp" id="temp">--</div>
      <div class="desc" id="desc">Carregando...</div>
    </div>
  </div>
</div>

<script>
/* ========= SAUDAÇÃO ========= */
const now = new Date();
const h = now.getHours();

let greet;
if (h >= 5 && h < 12) greet = "Bom dia, Felipe!";
else if (h >= 12 && h < 18) greet = "Boa tarde, Felipe!";
else greet = "Boa noite, Felipe!";

document.getElementById("greeting").textContent = greet;

/* ========= PROGRESSO DO ANO ========= */
const start = new Date(now.getFullYear(), 0, 1);
const end = new Date(now.getFullYear(), 11, 31);

const total = end - start;
const passed = now - start;

const percent = (passed / total) * 100;
const remainingDays = Math.floor((total - passed) / (1000 * 60 * 60 * 24));
const weeks = Math.floor(remainingDays / 7);

document.getElementById("percent").textContent = percent.toFixed(1);
document.getElementById("days").textContent = remainingDays;
document.getElementById("weeks").textContent = weeks;

/* animação suave da barra */
setTimeout(() => {
  document.getElementById("bar").style.width = percent + "%";
}, 200);

/* ========= CLIMA ========= */
function setIcon(type) {
  const icons = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
    </svg>`,

    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 17.5a4.5 4.5 0 0 0-2-8.5 6 6 0 0 0-11.6 2A4.5 4.5 0 0 0 6 21h12"/>
    </svg>`,

    snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2v20M4 7l16 10M20 7L4 17"/>
    </svg>`,

    wind: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 12h10a3 3 0 1 0-3-3"/>
      <path d="M4 16h14a3 3 0 1 1-3 3"/>
    </svg>`
  };

  return icons[type] || icons.cloud;
}

function setWeather(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r => r.json())
    .then(data => {
      const w = data.current_weather;
      const temp = w.temperature;

      document.getElementById("temp").textContent = temp + "°C";

      let type = "cloud";
      let desc = "Agradável";

      if (temp >= 30) {
        type = "sun";
        desc = "Quente";
      } else if (temp <= 18) {
        type = "snow";
        desc = "Frio";
      } else if (w.windspeed > 30) {
        type = "wind";
        desc = "Ventando";
      }

      document.getElementById("icon").innerHTML = setIcon(type);
      document.getElementById("desc").textContent = desc;
    });
}

navigator.geolocation.getCurrentPosition(
  pos => setWeather(pos.coords.latitude, pos.coords.longitude),
  () => {
    document.getElementById("desc").textContent = "Sem permissão de localização";
  }
);
</script>

</body>
</html>
