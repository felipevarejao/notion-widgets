<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: transparent; padding: 1rem; }
  .greeting { font-size: 22px; font-weight: 500; color: #111; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #666; }
</style>
</head>
<body>
  <div class="greeting" id="greeting-text"></div>
  <div class="sub" id="greeting-sub"></div>
  <script>
    const now = new Date();
    const h = now.getHours();
    let greet;
    if(h >= 5 && h < 12) greet = 'Bom dia, Felipe!';
    else if(h >= 12 && h < 18) greet = 'Boa tarde, Felipe!';
    else greet = 'Boa noite, Felipe!';
    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    document.getElementById('greeting-text').textContent = greet;
    document.getElementById('greeting-sub').textContent = dias[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()] + ' de ' + now.getFullYear();
  </script>
</body>
</html>
