<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Widget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }

  html, body {
    background-color: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .widget-root {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── TOP ROW ── */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .greeting { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }

  .quote-wrap {
    font-size: 11.5px;
    font-style: italic;
    color: rgba(255,255,255,0.38);
    margin-top: 4px;
    line-height: 1.45;
  }
  .quote-author {
    display: block;
    font-size: 9px;
    color: rgba(255,255,255,0.18);
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }

  .weather-block {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 9px 14px;
    flex-shrink: 0;
  }
  .w-icon { font-size: 26px; line-height: 1; }
  .w-temp { font-size: 26px; font-weight: 700; line-height: 1; }
  .w-desc { font-size: 9.5px; color: rgba(255,255,255,0.32); margin-top: 2px; }

  /* ── MIDDLE ROW ── */
  .middle-row {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .progress-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .progress-label {
    font-size: 10.5px;
    color: rgba(255,255,255,0.38);
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .progress-label span:last-child { font-weight: 600; color: rgba(255,255,255,0.55); }

  .bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 1.3s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .bar-year    { background: linear-gradient(90deg, #6366f1, #10b981); }
  .bar-quarter { background: linear-gradient(90deg, #ec4899, #8b5cf6); }
  .bar-month   { background: linear-gradient(90deg, #3b82f6, #06b6d4); }

  .days-left { font-size: 9.5px; color: rgba(255,255,255,0.22); margin-top: 2px; }
  .days-left strong { color: #fff; font-weight: 700; }

  .vdivider { width: 1px; background: rgba(255,255,255,0.05); align-self: stretch; }

  /* Calendar */
  .calendar-section { width: 218px; flex-shrink: 0; }
  .calendar-title {
    font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 9px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    font-size: 10px;
  }
  .calendar-day-head {
    font-weight: 700;
    color: rgba(255,255,255,0.14);
    font-size: 7.5px;
    padding-bottom: 4px;
    text-transform: uppercase;
  }
  .calendar-day {
    height: 20px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.48);
    border-radius: 50%;
  }
  .calendar-day.empty { visibility: hidden; }
  .calendar-day.today {
    color: #fff; font-weight: 700;
    background: #6366f1;
    box-shadow: 0 0 7px rgba(99,102,241,0.5);
  }

  /* ── MOBILE: stack vertically ── */
  @media (max-width: 520px) {
    html, body { width: 100%; }
    .widget-root { padding: 14px 14px; gap: 13px; }

    .top-row { flex-direction: column; align-items: flex-start; gap: 10px; }
    .weather-block { width: 100%; justify-content: flex-start; }
    .greeting { font-size: 18px; }
    .quote-wrap { font-size: 11px; }

    .middle-row { flex-direction: column; gap: 14px; }
    .vdivider { width: 100%; height: 1px; align-self: auto; }
    .calendar-section { width: 100%; }
    .calendar-grid { font-size: 11px; gap: 4px; }
    .calendar-day { height: 26px; font-size: 11px; }
    .calendar-day-head { font-size: 9px; padding-bottom: 6px; }
  }

  /* ── DESKTOP wide ── */
  @media (min-width: 521px) {
    html, body { width: 760px; }
    .quote-wrap { max-width: 360px; }
  }
</style>
</head>

  </div>

  <div class="middle-row">
    <div class="progress-section">
      <div class="progress-group">
        <div class="progress-label"><span>Ano Corrente</span><span><span id="percent-year">0.0</span>%</span></div>
        <div class="bar-container"><div class="bar bar-year" id="bar-year"></div></div>
      </div>
      <div class="progress-group">
        <div class="progress-label"><span>Trimestre Atual</span><span><span id="percent-quarter">0.0</span>%</span></div>

      </div>
      <div class="progress-group">
        <div class="progress-label"><span>Mês Vigente</span><span><span id="percent-month">0.0</span>%</span></div>
        <div class="bar-container"><div class="bar bar-month" id="bar-month"></div></div>
      </div>
      <div class="days-left">Faltam <strong id="days">0</strong> dias para o fim do ano.</div>
    </div>

    <div class="vdivider"></div>

    <div class="calendar-section">
      <div class="calendar-title" id="calendar-title">Calendário</div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>
</div>

const now = new Date();
const h = now.getHours();

// Saudação
const greet = h >= 5 && h < 12 ? "Bom dia, Felipe! ☕"
            : h >= 12 && h < 18 ? "Boa tarde, Felipe! ⚡"
            : "Boa noite, Felipe! 🌙";
document.getElementById("greeting").textContent = greet;

// Frase do dia — determinística pelo dia do ano, muda à meia-noite
const startOfYear = new Date(now.getFullYear(), 0, 0);
const dayOfYear = Math.floor((now - startOfYear) / 86400000);
const [quoteText, quoteAuthor] = FRASES[dayOfYear % FRASES.length];
document.getElementById("quote").textContent = `"${quoteText}"`;
document.getElementById("author").textContent = quoteAuthor;

// Progresso temporal
const startYear = new Date(now.getFullYear(), 0, 1);
const endYear   = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
const pYear = ((now - startYear) / (endYear - startYear)) * 100;
document.getElementById("percent-year").textContent = pYear.toFixed(1);
document.getElementById("days").textContent = Math.ceil((endYear - now) / 86400000);

const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
const endMonth   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
const pMonth = ((now - startMonth) / (endMonth - startMonth)) * 100;
document.getElementById("percent-month").textContent = pMonth.toFixed(1);

const qS = Math.floor(now.getMonth() / 3) * 3;
const startQ = new Date(now.getFullYear(), qS, 1);
const endQ   = new Date(now.getFullYear(), qS + 3, 0, 23, 59, 59, 999);
const pQ = ((now - startQ) / (endQ - startQ)) * 100;
document.getElementById("percent-quarter").textContent = pQ.toFixed(1);

setTimeout(() => {
  document.getElementById("bar-year").style.width    = pYear + "%";
  document.getElementById("bar-month").style.width   = pMonth + "%";
  document.getElementById("bar-quarter").style.width = pQ + "%";
}, 200);

// Calendário
(function() {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  document.getElementById("calendar-title").textContent = `${meses[now.getMonth()]} de ${now.getFullYear()}`;
  const grid = document.getElementById("calendar-grid");
  ["D","S","T","Q","Q","S","S"].forEach(d => {
    const el = document.createElement("div");
    el.className = "calendar-day-head";
    el.textContent = d;
    grid.appendChild(el);
  });
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const lastDay  = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "calendar-day empty";
    grid.appendChild(el);
  }
  for (let d = 1; d <= lastDay; d++) {
    const el = document.createElement("div");
    el.className = d === now.getDate() ? "calendar-day today" : "calendar-day";
    el.textContent = d;
    grid.appendChild(el);
  }
})();

// Clima
const SP_LAT = -23.5505, SP_LON = -46.6333;
function setWeather(lat, lon) {
  return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      const temp = Math.round(data.current_weather.temperature);
      document.getElementById("temp").textContent = temp + "°C";
      let icon = "⛅", desc = "Agradável";
      if (temp >= 30) { icon = "☀️"; desc = "Quente"; }
      else if (temp <= 18) { icon = "❄️"; desc = "Frio"; }
      document.getElementById("icon").textContent = icon;
      document.getElementById("desc").textContent = desc;
    });
}
function loadWeather() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => setWeather(p.coords.latitude, p.coords.longitude).catch(() => setWeather(SP_LAT, SP_LON)),
      () => setWeather(SP_LAT, SP_LON),
      { timeout: 5000 }
    );
  } else { setWeather(SP_LAT, SP_LON); }
}
loadWeather();
