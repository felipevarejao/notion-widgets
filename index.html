<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Felipe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }

  html, body {
    background: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .root {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ─── BLOCO 1: Saudação + Relógio ─── */
  .row-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .greeting {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .quote-wrap {
    margin-top: 6px;
    font-size: 11.5px;
    font-style: italic;
    color: rgba(255,255,255,0.35);
    line-height: 1.5;
    max-width: 340px;
  }
  .quote-author {
    display: block;
    font-size: 9px;
    color: rgba(255,255,255,0.16);
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }

  .clock-block { text-align: right; flex-shrink: 0; }
  .clock-time {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .clock-date {
    font-size: 10px;
    color: rgba(255,255,255,0.28);
    margin-top: 4px;
    text-transform: capitalize;
  }

  /* ─── DIVISOR ─── */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
  }

  /* ─── BLOCO 2: Clima ─── */
  .row-weather {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .w-main {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .w-icon { font-size: 52px; line-height: 1; }
  .w-center {}
  .w-temp {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
  }
  .w-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 3px;
  }

  .w-details {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-left: auto;
  }
  .w-detail-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
  .w-detail-row span {
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    font-weight: 600;
    min-width: 38px;
  }

  .w-battery {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-left: 16px;
    border-left: 1px solid rgba(255,255,255,0.07);
  }
  .batt-wrap {
    position: relative;
    width: 32px;
    height: 16px;
  }
  .batt-body {
    width: 28px; height: 16px;
    border: 1.5px solid rgba(255,255,255,0.35);
    border-radius: 3px;
    overflow: hidden;
    position: absolute; left: 0; top: 0;
  }
  .batt-fill {
    height: 100%;
    background: #10b981;
    transition: width 0.5s;
  }
  .batt-fill.low { background: #ef4444; }
  .batt-fill.med { background: #f59e0b; }
  .batt-cap {
    width: 3px; height: 7px;
    background: rgba(255,255,255,0.35);
    border-radius: 0 2px 2px 0;
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%);
  }
  .batt-pct { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }
  .batt-status { font-size: 9px; color: rgba(255,255,255,0.2); }

  /* ─── BLOCO 3: Dias do ano ─── */
  .row-days {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 11px 16px;
  }
  .days-label { font-size: 11px; color: rgba(255,255,255,0.3); }
  .days-number { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .days-sub { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 1px; }
  .days-year { font-size: 11px; color: rgba(255,255,255,0.22); }

  /* ─── BLOCO 4: Pomodoro recolhível ─── */
  .row-pomodoro {
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .row-pomodoro.open { border-color: rgba(99,102,241,0.35); }

  .pomo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 16px;
    cursor: pointer;
    user-select: none;
  }
  .pomo-header:hover { background: rgba(255,255,255,0.02); }

  .pomo-header-left { display: flex; align-items: center; gap: 10px; }
  .pomo-header-icon { font-size: 16px; }
  .pomo-header-label { font-size: 12px; color: rgba(255,255,255,0.5); }
  .pomo-header-time {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    color: rgba(255,255,255,0.7);
  }
  .pomo-header-time.running { color: #6366f1; }
  .pomo-header-time.break-  { color: #10b981; }

  .pomo-header-right { display: flex; align-items: center; gap: 8px; }
  .pomo-mini-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .pomo-mini-btn:hover { background: rgba(255,255,255,0.08); }
  .pomo-mini-btn.play { border-color: rgba(99,102,241,0.5); color: #818cf8; }

  .pomo-chevron {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    transition: transform 0.2s;
    margin-left: 4px;
  }
  .open .pomo-chevron { transform: rotate(180deg); }

  .pomo-body {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .open .pomo-body { display: block; }

  .pomo-big-time {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    margin-top: 12px;
    color: #fff;
    line-height: 1;
  }
  .pomo-big-time.running { color: #6366f1; }
  .pomo-big-time.onbreak { color: #10b981; }

  .pomo-body-label { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 6px; }

  .pomo-dots {
    display: flex; gap: 5px; margin-top: 8px;
  }
  .pomo-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
  }
  .pomo-dot.done { background: #6366f1; }

  .pomo-body-controls {
    display: flex; gap: 10px; margin-top: 14px;
  }
  .pomo-ctrl-btn {
    flex: 1; padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .pomo-ctrl-btn:hover { background: rgba(255,255,255,0.06); }
  .pomo-ctrl-btn.primary {
    border-color: rgba(99,102,241,0.4);
    color: #818cf8;
  }
  .pomo-ctrl-btn.primary:hover { background: rgba(99,102,241,0.1); }

  /* ─── MOBILE ─── */
  @media (max-width: 500px) {
    html, body { width: 100%; }
    .root { padding: 14px 15px; gap: 15px; }
    .greeting { font-size: 19px; }
    .clock-time { font-size: 26px; }
    .w-icon { font-size: 40px; }
    .w-temp { font-size: 34px; }
    .w-details { display: none; }
    .row-weather { gap: 12px; }
  }
  @media (min-width: 501px) {
    html, body { width: 760px; }
  }
</style>
</head>
<body>
<div class="root">

  <!-- BLOCO 1: Saudação + Relógio -->
  <div class="row-header">
    <div>
      <div class="greeting" id="greeting"></div>
      <div class="quote-wrap">
        <span id="quote"></span>
        <span id="author" class="quote-author"></span>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock-time" id="clock-time">00:00:00</div>
      <div class="clock-date" id="clock-date"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- BLOCO 2: Clima -->
  <div class="row-weather">
    <div class="w-main">
      <div class="w-icon" id="w-icon">⛅</div>
      <div class="w-center">
        <div class="w-temp" id="w-temp">--°</div>
        <div class="w-desc" id="w-desc">Carregando...</div>
      </div>
    </div>

    <div class="w-details">
      <div class="w-detail-row">↑ máx <span id="w-max">--°</span></div>
      <div class="w-detail-row">↓ mín <span id="w-min">--°</span></div>
      <div class="w-detail-row">sensação <span id="w-feels">--°</span></div>
    </div>

    <div class="w-battery" id="w-battery">
      <div class="batt-wrap">
        <div class="batt-body"><div class="batt-fill" id="batt-fill" style="width:80%"></div></div>
        <div class="batt-cap"></div>
      </div>
      <div class="batt-pct" id="batt-pct">--%</div>
      <div class="batt-status" id="batt-status"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- BLOCO 3: Dias restantes -->
  <div class="row-days">
    <div>
      <div class="days-label">dias restantes em</div>
      <div class="days-year" id="days-year">2025</div>
    </div>
    <div style="text-align:right">
      <div class="days-number" id="days-left">--</div>
      <div class="days-sub" id="days-sub">de 365 dias</div>
    </div>
  </div>

  <!-- BLOCO 4: Pomodoro recolhível -->
  <div class="row-pomodoro" id="pomo-wrap">
    <div class="pomo-header" id="pomo-header">
      <div class="pomo-header-left">
        <span class="pomo-header-icon">⏳</span>
        <span class="pomo-header-label" id="pomo-hlabel">Pomodoro</span>
        <span class="pomo-header-time" id="pomo-htime">25:00</span>
      </div>
      <div class="pomo-header-right">
        <button class="pomo-mini-btn play" id="pomo-mini-play" title="Play/Pause">▶</button>
        <span class="pomo-chevron" id="pomo-chevron">▼</span>
      </div>
    </div>
    <div class="pomo-body" id="pomo-body">
      <div class="pomo-big-time" id="pomo-bigtime">25:00</div>
      <div class="pomo-body-label" id="pomo-blabel">Sessão 1 de 4 · Foco</div>
      <div class="pomo-dots" id="pomo-dots"></div>
      <div class="pomo-body-controls">
        <button class="pomo-ctrl-btn" id="pomo-reset">↺ Reiniciar</button>
        <button class="pomo-ctrl-btn primary" id="pomo-play">▶ Iniciar</button>
        <button class="pomo-ctrl-btn" id="pomo-skip">⏭ Pular</button>
      </div>
    </div>
  </div>

</div>
<script>
const FRASES = [
  ["A jornada de mil milhas começa com um único passo.", "Lao Tsé"],
  ["Só existe um modo de evitar críticas: não fazer nada.", "Aristóteles"],
  ["O sucesso é a soma de pequenos esforços repetidos dia após dia.", "R. Collier"],
  ["Não é sobre ter tempo, é sobre fazer tempo.", "Anônimo"],
  ["O segredo de começar é parar de falar e começar a agir.", "Mark Twain"],
  ["Disciplina é escolher entre o que quer agora e o que quer mais.", "Anônimo"],
  ["O homem que move montanhas começa carregando pequenas pedras.", "Confúcio"],
  ["Sonhos não funcionam a menos que você trabalhe.", "John C. Maxwell"],
  ["A produtividade nunca é acidente. É sempre compromisso com excelência.", "Paul J. Meyer"],
  ["Não espere pela oportunidade perfeita. Crie-a.", "George Bernard Shaw"],
  ["A concentração é a raiz de toda capacidade humana.", "Bruce Lee"],
  ["O único lugar onde sucesso vem antes de trabalho é no dicionário.", "Vidal Sassoon"],
  ["Você se torna no que você pensa o dia inteiro.", "Ralph Waldo Emerson"],
  ["Comece onde você está. Use o que tem. Faça o que pode.", "Arthur Ashe"],
  ["Persistência é o caminho do êxito.", "Charles Chaplin"],
  ["A melhor forma de prever o futuro é criá-lo.", "Peter Drucker"],
  ["Foco é dizer não.", "Steve Jobs"],
  ["Não conte os dias; faça os dias contarem.", "Muhammad Ali"],
  ["Seja a mudança que você quer ver no mundo.", "Gandhi"],
  ["O sucesso não é final, o fracasso não é fatal: é a coragem de continuar que conta.", "Churchill"],
  ["Aprenda como se fosse viver para sempre, viva como se fosse morrer amanhã.", "Gandhi"],
  ["Erros são a prova de que você está tentando.", "Anônimo"],
  ["Sonhe alto, mas trabalhe mais alto ainda.", "Anônimo"],
  ["Uma pequena melhoria por dia resulta em grande melhoria ao longo do tempo.", "James Clear"],
  ["O hábito é o segundo caráter.", "Platão"],
  ["Investir em conhecimento paga os melhores juros.", "Benjamin Franklin"],
  ["Feito é melhor que perfeito.", "Sheryl Sandberg"],
  ["A simplicidade é a sofisticação máxima.", "Leonardo da Vinci"],
  ["Em meio à dificuldade reside a oportunidade.", "Albert Einstein"],
  ["Imaginação é mais importante que conhecimento.", "Albert Einstein"],
  ["Sistemas vencem metas.", "James Clear"],
  ["Você não sobe ao nível de suas metas; cai ao nível de seus sistemas.", "James Clear"],
  ["A consistência bate o talento quando o talento não é consistente.", "Anônimo"],
  ["Não deixe para amanhã o que você pode fazer hoje.", "Benjamin Franklin"],
  ["O tempo é um recurso não renovável; invista-o sabiamente.", "Anônimo"],
  ["O único jeito de fazer um ótimo trabalho é amar o que você faz.", "Steve Jobs"],
  ["Coragem não é ausência de medo, é agir apesar do medo.", "Nelson Mandela"],
  ["Caia sete vezes, levante oito.", "Provérbio japonês"],
  ["A gota d'água fura a pedra não pela força, mas pela persistência.", "Ovídio"],
  ["Conforto e crescimento raramente coexistem.", "Anônimo"],
  ["Seja impecável com sua palavra.", "Don Miguel Ruiz"],
  ["Faça sempre o seu melhor.", "Don Miguel Ruiz"],
  ["Ouça mais, fale menos.", "Anônimo"],
  ["Humildade intelectual é a base do aprendizado contínuo.", "Anônimo"],
  ["Nunca pare de aprender porque a vida nunca para de ensinar.", "Anônimo"],
  ["Sabedoria é saber o que ignorar.", "William James"],
  ["Menos, mas melhor.", "Dieter Rams"],
  ["Perfeição é quando não há mais nada a tirar.", "Saint-Exupéry"],
  ["Excelência está nos detalhes.", "Anônimo"],
  ["Melhore 1% por dia. Em um ano, você será 37x melhor.", "James Clear"],
  ["Gerencie sua energia, não apenas seu tempo.", "Tony Schwartz"],
  ["O que você dá atenção cresce.", "Anônimo"],
  ["Aquele que tem um porquê pode suportar qualquer como.", "Nietzsche"],
  ["Comece pelo porquê.", "Simon Sinek"],
  ["Seus valores são sua bússola.", "Anônimo"],
  ["O melhor momento para começar era ontem. O segundo melhor é agora.", "Provérbio chinês"],
  ["Sua única competição é quem você era ontem.", "Anônimo"],
  ["Todo expert já foi um iniciante.", "Anônimo"],
  ["A determinação de hoje escreve a história de amanhã.", "Anônimo"],
  ["Falhe rápido, aprenda mais rápido.", "Silicon Valley"],
  ["Faça hoje o que o futuro você agradecerá.", "Anônimo"],
  ["Plante árvores cuja sombra você não usará.", "Provérbio grego"],
  ["A energia é a moeda do desempenho.", "Tony Schwartz"],
  ["Propósito é o combustível da persistência.", "Anônimo"],
  ["Gratidão transforma o que temos em suficiente.", "Anônimo"],
  ["Confie no processo.", "Anônimo"],
  ["A ação cura o medo, a inação o alimenta.", "Anônimo"],
  ["Pense em décadas, aja em dias.", "Anônimo"],
  ["Autoconsciência é o fundamento de toda mudança.", "Anônimo"],
  ["Amanhã começa hoje.", "Anônimo"],
  ["A grandeza é construída diariamente em pequenas escolhas.", "Anônimo"],
  ["Deep work: trabalho profundo é raro e valioso.", "Cal Newport"],
  ["Escrever clarifica o pensamento.", "Anônimo"],
  ["Paciência é uma forma de ação.", "Auguste Rodin"],
  ["Este momento é suficiente.", "Anônimo"],
  ["Mostre-se. Faça a diferença. Repita.", "Anônimo"],
  ["A felicidade é um subproduto do engajamento profundo.", "Anônimo"],
  ["Aja de acordo com seus valores, não com seus humores.", "Anônimo"],
  ["Semeie um hábito, colha um caráter. Semeie um caráter, colha um destino.", "Charles Reade"],
  ["Os hábitos são os juros compostos do autodesenvolvimento.", "James Clear"],
  ["Cada passo à frente conta.", "Anônimo"],
  ["Construa um legado, não um currículo.", "Anônimo"],
  ["Levante enquanto sobe.", "Anônimo"],
  ["Decida rápido, corrija rapidamente.", "Anônimo"]
];

const now = new Date();
const h = now.getHours();

// Saudação
document.getElementById("greeting").textContent =
  h >= 5 && h < 12 ? "Bom dia, Felipe! ☕" :
  h >= 12 && h < 18 ? "Boa tarde, Felipe! ⚡" : "Boa noite, Felipe! 🌙";

// Frase do dia
const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
const [qt, qa] = FRASES[doy % FRASES.length];
document.getElementById("quote").textContent = `"${qt}"`;
document.getElementById("author").textContent = qa;

// Relógio
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function tick() {
  const t = new Date();
  document.getElementById("clock-time").textContent =
    `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}`;
  document.getElementById("clock-date").textContent =
    `${DIAS[t.getDay()]}, ${t.getDate()} ${MESES[t.getMonth()]} ${t.getFullYear()}`;
}
tick(); setInterval(tick, 1000);

// Dias restantes
const ey = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
const dLeft = Math.ceil((ey - now) / 86400000);
const isLeap = now.getFullYear() % 4 === 0 && (now.getFullYear() % 100 !== 0 || now.getFullYear() % 400 === 0);
document.getElementById("days-left").textContent = dLeft;
document.getElementById("days-year").textContent = now.getFullYear();
document.getElementById("days-sub").textContent = `de ${isLeap ? 366 : 365} dias`;

// Bateria
if (navigator.getBattery) {
  navigator.getBattery().then(bat => {
    function updBatt() {
      const pct = Math.round(bat.level * 100);
      document.getElementById("batt-pct").textContent = pct + "%";
      const f = document.getElementById("batt-fill");
      f.style.width = pct + "%";
      f.className = "batt-fill" + (pct <= 20 ? " low" : pct <= 40 ? " med" : "");
      document.getElementById("batt-status").textContent = bat.charging ? "⚡ carregando" : "";
    }
    updBatt();
    bat.addEventListener("levelchange", updBatt);
    bat.addEventListener("chargingchange", updBatt);
    document.getElementById("w-battery").style.display = "flex";
  }).catch(() => {});
}

// Clima
const SP_LAT = -23.5505, SP_LON = -46.6333;
const WC_DESC = { 0:"Céu limpo", 1:"Quase limpo", 2:"Parcialmente nublado", 3:"Nublado", 45:"Neblina", 48:"Neblina com gelo",
  51:"Garoa leve", 53:"Garoa moderada", 55:"Garoa intensa", 61:"Chuva leve", 63:"Chuva moderada", 65:"Chuva forte",
  71:"Neve leve", 73:"Neve moderada", 75:"Neve intensa", 80:"Pancadas leves", 81:"Pancadas moderadas", 82:"Pancadas fortes",
  95:"Tempestade", 96:"Tempestade c/ granizo", 99:"Tempestade forte" };
const WC_ICON = c => c === 0 ? (h >= 6 && h < 20 ? "☀️" : "🌙") : c <= 2 ? "⛅" : c <= 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 77 ? "❄️" : "⛈️";

function setWeather(lat, lon) {
  return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max&timezone=auto&forecast_days=1`)
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => {
      const cw = d.current_weather;
      const temp = Math.round(cw.temperature);
      document.getElementById("w-temp").textContent = temp + "°";
      document.getElementById("w-icon").textContent = WC_ICON(cw.weathercode);
      document.getElementById("w-desc").textContent = WC_DESC[cw.weathercode] || "—";
      if (d.daily) {
        document.getElementById("w-max").textContent = Math.round(d.daily.temperature_2m_max[0]) + "°";
        document.getElementById("w-min").textContent = Math.round(d.daily.temperature_2m_min[0]) + "°";
        document.getElementById("w-feels").textContent = Math.round(d.daily.apparent_temperature_max[0]) + "°";
      }
    });
}
(navigator.geolocation
  ? new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 }))
      .then(p => setWeather(p.coords.latitude, p.coords.longitude))
      .catch(() => setWeather(SP_LAT, SP_LON))
  : setWeather(SP_LAT, SP_LON));

// Pomodoro
const POMO = { WORK: 25*60, SHORT: 5*60, LONG: 15*60, MAX: 4 };
let ps = { running: false, isBreak: false, session: 1, rem: POMO.WORK, timer: null };

function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }

function pomoRender() {
  const t = fmt(ps.rem);
  const cls = ps.running && !ps.isBreak ? " running" : ps.isBreak ? " onbreak" : "";
  document.getElementById("pomo-htime").textContent = t;
  document.getElementById("pomo-htime").className = "pomo-header-time" + cls;
  document.getElementById("pomo-bigtime").textContent = t;
  document.getElementById("pomo-bigtime").className = "pomo-big-time" + cls;
  document.getElementById("pomo-hlabel").textContent = ps.isBreak ? "Pausa" : "Pomodoro";
  document.getElementById("pomo-blabel").textContent = ps.isBreak
    ? (ps.session > POMO.MAX ? "Pausa longa · 15 min" : "Pausa curta · 5 min")
    : `Sessão ${ps.session} de ${POMO.MAX} · Foco`;
  const playTxt = ps.running ? "⏸ Pausar" : "▶ Iniciar";
  document.getElementById("pomo-play").textContent = playTxt;
  document.getElementById("pomo-mini-play").textContent = ps.running ? "⏸" : "▶";
  const dots = document.getElementById("pomo-dots");
  dots.innerHTML = "";
  for (let i = 1; i <= POMO.MAX; i++) {
    const d = document.createElement("div");
    d.className = "pomo-dot" + (i < ps.session ? " done" : "");
    dots.appendChild(d);
  }
}

function pomoNext() {
  clearInterval(ps.timer); ps.running = false;
  if (!ps.isBreak) {
    ps.isBreak = true;
    const long = ps.session >= POMO.MAX;
    ps.rem = long ? POMO.LONG : POMO.SHORT;
    if (long) ps.session = 0;
  } else {
    ps.isBreak = false; ps.session++; ps.rem = POMO.WORK;
  }
  pomoRender();
}

function pomoToggle() {
  if (ps.running) { clearInterval(ps.timer); ps.running = false; }
  else {
    ps.running = true;
    ps.timer = setInterval(() => { ps.rem--; if (ps.rem <= 0) pomoNext(); else pomoRender(); }, 1000);
  }
  pomoRender();
}

document.getElementById("pomo-header").addEventListener("click", e => {
  if (e.target.closest("button")) return;
  const wrap = document.getElementById("pomo-wrap");
  wrap.classList.toggle("open");
});
document.getElementById("pomo-mini-play").addEventListener("click", e => { e.stopPropagation(); pomoToggle(); });
document.getElementById("pomo-play").addEventListener("click", pomoToggle);
document.getElementById("pomo-reset").addEventListener("click", () => {
  clearInterval(ps.timer);
  ps = { running: false, isBreak: false, session: 1, rem: POMO.WORK, timer: null };
  pomoRender();
});
document.getElementById("pomo-skip").addEventListener("click", pomoNext);

pomoRender();
</script>
</body>
