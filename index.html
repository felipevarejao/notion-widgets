<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Widget - Dark Mode Fixo</title>
<style>
  /* Remove qualquer margem e esconde as barras de rolagem */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scrollbar-width: none; 
  }
  *::-webkit-scrollbar {
    display: none;
  }

  html, body {
    /* Força EXATAMENTE a cor de fundo do Modo Escuro do Notion */
    background-color: #191919 !important; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    /* Força os textos principais a serem brancos e brilhantes no fundo escuro */
    color: #ffffff !important; 
    padding: 12px;
    max-width: 360px;
    overflow: hidden;
  }

  /* Estrutura sem caixas brancas, totalmente integrada ao fundo escuro */
  .section {
    margin-bottom: 24px;
    padding: 0 !important; 
    background: transparent !important; 
    border: none !important;
    box-shadow: none !important;
  }

  /* Títulos em cinza claro fosco, idêntico ao padrão do Notion */
  .title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: rgba(255, 255, 255, 0.4) !important; 
    text-transform: capitalize;
    letter-spacing: 0.3px;
  }

  /* Texto de saudação em branco puro */
  .greeting {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #ffffff !important;
  }

  /* Container de fundo da barra de progresso adaptado para o escuro */
  .bar-container {
    width: 100%;
    height: 12px;
    background: rgba(255, 255, 255, 0.1) !important; 
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }

  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #10b981) !important;
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Estatísticas em cinza bem claro para leitura perfeita */
  .stats {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    color: rgba(255, 255, 255, 0.8) !important;
  }

  .value {
    font-weight: 700;
    color: #ffffff !important;
  }

  /* Clima */
  .weather {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
  }

  .temp {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
    color: #ffffff !important;
  }

  .desc {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5) !important;
    margin-top: 2px;
  }

  .icon {
    font-size: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>

<body>

<div class="section">
  <div class="title">Saudação</div>
  <div class="greeting" id="greeting"></div>
</div>

<div class="section">
  <div class="title">Progresso do Ano</div>

  <div class="bar-container">
    <div class="bar" id="bar"></div>
  </div>

  <div class="stats">
    <div>Progresso: <span class="value" id="percent">0.0</span>%</div>
    <div>Faltam: <span class="value" id="days">0</span> dias</div>
    <div>ou <span class="value" id="weeks">0</span> semanas</div>
  </div>
</div>

<div class="section">
  <div class="title">Clima</div>

  <div class="weather">
    <div class="icon" id="icon">⛅</div>
    <div>
      <div class="temp" id="temp">--°C</div>
      <div class="desc" id="desc">Carregando...</div>
    </div>
  </div>
</div>

<script>
/* ========= SAUDAÇÃO ========= */
const now = new Date();
const h = now.getHours();

let greet;
if (h >= 5 && h < 12) greet = "Bom dia, Felipe!";
else if (h >= 12 && h < 18) greet = "Boa tarde, Felipe!";
else greet = "Boa noite, Felipe!";

document.getElementById("greeting").textContent = greet;

/* ========= PROGRESSO DO ANO ========= */
const start = new Date(now.getFullYear(), 0, 1);
const end = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);

const total = end - start;
const passed = now - start;

const percent = (passed / total) * 100;
const remainingDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
const remainingWeeks = Math.floor(remainingDays / 7);

document.getElementById("percent").textContent = percent.toFixed(1);
document.getElementById("days").textContent = remainingDays;
document.getElementById("weeks").textContent = remainingWeeks;

setTimeout(() => {
  document.getElementById("bar").style.width = percent + "%";
}, 200);

/* ========= CLIMA ========= */
function setWeather(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r => r.json())
    .then(data => {
      const w = data.current_weather;
      const temp = Math.round(w.temperature);

      document.getElementById("temp").textContent = temp + "°C";

      let icon = "⛅";
      let desc = "Agradável";

      if (temp >= 30) {
        icon = "☀️";
        desc = "Quente";
      } else if (temp <= 18) {
        icon = "❄️";
        desc = "Frio";
      } else if (w.windspeed > 30) {
        icon = "🌬️";
        desc = "Ventando";
      }

      document.getElementById("icon").textContent = icon;
      document.getElementById("desc").textContent = desc;
    })
    .catch(() => {
      document.getElementById("desc").textContent = "Sem dados de clima";
    });
}

function fallbackLocation() {
  fetch("https://ipapi.co/json/")
    .then(r => r.json())
    .then(loc => {
      setWeather(loc.latitude, loc.longitude);
    })
    .catch(() => {
      document.getElementById("desc").textContent = "Localização indisponível";
    });
}

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => setWeather(pos.coords.latitude, pos.coords.longitude),
    () => fallbackLocation()
  );
} else {
  fallbackLocation();
}
</script>

</body>
</html>
